<style>body{margin:0;background:#12151b}canvas{image-rendering:pixelated;display:block}</style>
<canvas id="out"></canvas>
<script>
const T=32,S=3,CW=150,CH=150,COLS=8;
// every prop the infirmary uses: [label, sheet, col, row, w, h]
const P=[
 ['bedA','furn',15,7,2,2],       ['bedB','furn',15,10,2,2],   ['cot green','furn',11,7,2,2],
 ['cot grey','furn',11,9,2,2],   ['trolley','furn',8,3,2,2],  ['drip pole','furn',19,12,1,4],
 ['console','furn',1,13,1,1],    ['stool','furn',4,4,1,2],    ['chair A','furn',3,4,1,2],
 ['chair B','furn',5,4,1,2],     ['low table','furn',7,4,1,2],['bench','furn',8,13,1,1],
 ['bench2','furn',9,13,1,1],     ['oxy orange','furn',1,6,1,2],['oxy blue','furn',1,7,1,2],
 ['kit red','furn',8,7,1,1],     ['kit green','furn',9,8,1,1],['kit red2','furn',8,9,1,1],
 ['crate','furn',15,12,1,1],     ['box','furn',12,12,1,1],    ['locker','furn',12,3,1,2],
 ['papers','furn',2,11,1,1],     ['sheet fold','furn',16,9,1,1],['pillow','furn',8,11,1,1],
 ['bin?','furn',12,14,1,1],      ['drum','furn',3,14,1,1],    ['case','furn',14,13,1,1],
 ['cross','furn',8,8,1,1],       ['records','furn',13,15,1,1],['warning','furn',16,14,1,1],
 ['calendar','furn',13,0,1,1],   ['pipe h','furn',0,9,1,1],   ['pipe v','furn',0,10,1,1],
 ['cabinet','kit',0,9,2,2],      ['cabinet2','kit',3,9,2,2],  ['rack','kit',9,11,2,2],
 ['rack tall','kit',0,11,2,3],   ['counter','kit',2,7,2,2],   ['counter plain','kit',10,7,2,2],
 ['counter drw','kit',0,7,2,2],  ['sink','kit',2,4,2,2],      ['sink2','kit',4,4,2,2],
 ['shelf steel','kit',10,12,2,2],['trolley kit','kit',3,12,2,2],['bin kit','kit',13,11,1,3]
];
const SH={};
function load(n,u){return new Promise(r=>{const i=new Image();i.onload=()=>{SH[n]=i;r();};i.src=u;});}
Promise.all([load('furn','../../public/assets/props/shelter_furniture.png'),load('kit','../../public/assets/props/kitchen.png')]).then(()=>{
  const rows=Math.ceil(P.length/COLS);
  const c=document.getElementById('out');
  c.width=COLS*CW; c.height=rows*CH;
  const x=c.getContext('2d'); x.imageSmoothingEnabled=false;
  x.fillStyle='#1a1f28'; x.fillRect(0,0,c.width,c.height);
  P.forEach((p,i)=>{
    const cx=(i%COLS)*CW, cy=Math.floor(i/COLS)*CH;
    x.fillStyle=(i%2)?'#20262f':'#1c222a'; x.fillRect(cx,cy,CW-2,CH-2);
    const w=p[4],h=p[5], dw=w*T*S, dh=h*T*S;
    const sc=Math.min(1,(CW-16)/dw,(CH-34)/dh);
    x.drawImage(SH[p[1]],p[2]*T,p[3]*T,w*T,h*T,
                cx+(CW-dw*sc)/2, cy+22+(CH-30-dh*sc)/2, dw*sc, dh*sc);
    x.fillStyle='#9fd8ff'; x.font='bold 13px monospace'; x.textAlign='center';
    x.fillText(p[0], cx+CW/2, cy+15);
    x.fillStyle='rgba(159,216,255,.5)'; x.font='11px monospace';
    x.fillText(`${p[1]}(${p[2]},${p[3]}) ${w}x${h}`, cx+CW/2, cy+CH-8);
  });
  window.__ready=1;
});
</script>
