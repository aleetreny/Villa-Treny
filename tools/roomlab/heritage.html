<meta charset="utf-8">
<title>Mansion, diner and graveyard · RoomLab</title>
<style>
  :root{color-scheme:dark}*{box-sizing:border-box}
  body{margin:0;background:#090b0e;color:#bec7dc;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}
  header{padding:18px 20px 8px}h1{margin:0;color:#f0f2f8;font-size:14px;font-weight:500;letter-spacing:.08em}
  p{margin:5px 0 0;color:#77839f;max-width:980px}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;padding:18px 20px 34px;align-items:start}
  figure{margin:0;padding:14px;background:#10131a;border:1px solid #242b39}.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
  .panel{min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;background:#0b0e13;border:1px solid #1c2230;padding:10px;overflow:hidden}
  .panel small{align-self:stretch;margin-bottom:8px;color:#66718d;text-transform:uppercase;letter-spacing:.1em}canvas,.reference{display:block;max-width:100%;height:auto;image-rendering:pixelated}
  figcaption{padding-top:10px;color:#7f8ba8}figcaption b{color:#eef1f8;font-weight:500}figcaption span{color:#d5a95a}code{color:#9ec6ef}
  @media(max-width:980px){main{grid-template-columns:1fr}}
</style>
<header><h1>MANSION WING · DINER SUITE · EXTERIOR GRAVEYARD</h1><p>Eight complete ZIP compositions, shown beside their native-pixel outputs.</p></header>
<main id="rooms"></main>
<script type="module">
import { HERITAGE, HERITAGE_MANIFEST, HERITAGE_SOURCES, drawHeritage, loadHeritageSources } from './heritage-kit.js?v=heritage-1';
const rooms = [
  ['library','mansion office and library'],['grandbedroom','complete mansion bedroom'],['salon','formal dining and sitting suite'],['hearth','fireplace reading room'],
  ['servicecounter','compact diner counter'],['maindiner','red diner and jukebox'],['sodabar','pink and teal soda bar'],['graveyard','open-air cemetery'],
];
const sources = await loadHeritageSources(); const root = document.getElementById('rooms');
for (const [key,note] of rooms) {
  const size=HERITAGE[key], manifest=HERITAGE_MANIFEST[key]; const native=document.createElement('canvas'); native.width=size.W; native.height=size.H;
  drawHeritage(native.getContext('2d'),sources,key); const canvas=document.createElement('canvas'); canvas.width=size.W*2; canvas.height=size.H*2; canvas.dataset.room=key;
  const g=canvas.getContext('2d'); g.imageSmoothingEnabled=false; g.drawImage(native,0,0,canvas.width,canvas.height);
  const figure=document.createElement('figure'), compare=document.createElement('div'); compare.className='compare';
  const ref=document.createElement('div'); ref.className='panel'; ref.innerHTML='<small>ZIP reference</small>'; const image=document.createElement('img'); image.className='reference'; image.src=HERITAGE_SOURCES[manifest.sheet]; image.alt=size.label+' reference'; ref.appendChild(image); compare.appendChild(ref);
  const out=document.createElement('div'); out.className='panel'; out.innerHTML='<small>exact room crop</small>'; out.appendChild(canvas); compare.appendChild(out); figure.appendChild(compare);
  const caption=document.createElement('figcaption'); caption.innerHTML='<b>'+size.label+'</b> · '+size.W+'x'+size.H+' native · <span>'+note+'</span><br><code>'+manifest.strategy+'</code>'; figure.appendChild(caption); root.appendChild(figure);
}
window.__ready=1;
</script>
